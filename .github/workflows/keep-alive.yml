name: ⚡ Aether Keep-Alive & Push Notifications

# Render free tier sleeps after 15 min inactivity.
# यह workflow हर 10 मिनट पर server को जगाए रखता है
# और due reminders के लिए Web Push notifications भेजता है।

on:
  schedule:
    - cron: '*/5 * * * *'   # हर 5 मिनट पर पिंग (Render 15 min स्लीप से हमेशा पहले)
  workflow_dispatch:        # Manual trigger भी कर सकते हैं

jobs:
  keep-alive-and-push:
    name: Ping Server & Trigger Push Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🏓 Ping Aether Server (Keep-Alive)
        run: |
          echo "⚡ Pinging Aether server to prevent cold start..."
          # Render free tier cold start can take ~50 seconds.
          # Allow 65s timeout and gracefully trap errors so GitHub Actions doesn't fail with false alarms.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: AetherPingBot/2.0 (KeepAlive)" \
            --connect-timeout 20 \
            --max-time 65 \
            --retry 2 \
            --retry-delay 5 \
            "https://aether-kjrj.onrender.com/api/health" || echo "000")
          echo "Server response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Server is awake and healthy!"
          elif [ "$STATUS" = "000" ]; then
            echo "⚠️ Server ping timed out / waking up from cold sleep (handled gracefully)"
          else
            echo "⚠️ Server returned $STATUS — waking up from sleep"
          fi

      - name: 🔔 Trigger Due Reminder Push Notifications
        run: |
          echo "🔔 Triggering push notifications for due reminders..."
          PUSH_STATUS=$(curl -s -o /tmp/push_response.json -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 45 \
            --retry 1 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Actions: true" \
            "https://aether-kjrj.onrender.com/api/reminders/push-check" || echo "000")
          echo "Push check status: $PUSH_STATUS"
          if [ -s /tmp/push_response.json ]; then
            cat /tmp/push_response.json || true
          fi

      - name: 📊 Log Status
        run: |
          echo "✅ Keep-alive cycle complete at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Next ping in ~10 minutes"
