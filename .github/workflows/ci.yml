name: 🚀 Aether Continuous Integration (CI)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-tests:
    name: 🐍 Backend Test Suite & Security Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: aether_test
          POSTGRES_USER: aether_app_user
          POSTGRES_PASSWORD: aether_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          cd server
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bounded Data Access Regression Tests
        run: |
          cd server
          python -m unittest discover -s tests -p "test_data_access.py"

      - name: Setup Dedicated Non-Superuser Runtime Role in PostgreSQL
        run: |
          export PGPASSWORD=aether_secure_password
          psql -h localhost -U aether_app_user -d aether_test -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'aether_app_runtime') THEN
                CREATE ROLE aether_app_runtime WITH LOGIN PASSWORD 'runtime_secure_pass' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
              END IF;
            END \$\$;
            GRANT ALL PRIVILEGES ON DATABASE aether_test TO aether_app_runtime;
            GRANT ALL ON SCHEMA public TO aether_app_runtime;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO aether_app_runtime;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO aether_app_runtime;
          "

      - name: Run Alembic Database Migrations on PostgreSQL
        env:
          DATABASE_URL: "postgresql://aether_app_user:aether_secure_password@localhost:5432/aether_test"
        run: |
          cd server
          alembic upgrade head
          python -c "from database import ensure_schema_migrations; ensure_schema_migrations()"

      - name: Verify Alembic Schema Consistency (Fail-Fast)
        env:
          DATABASE_URL: "postgresql://aether_app_user:aether_secure_password@localhost:5432/aether_test"
        run: |
          cd server
          alembic check

      - name: Grant Privileges to Non-Superuser Runtime Role
        run: |
          export PGPASSWORD=aether_secure_password
          psql -h localhost -U aether_app_user -d aether_test -c "
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO aether_app_runtime;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO aether_app_runtime;
          "

      - name: Run Autonomous Agent Architectural Tests
        run: |
          python tests/test_agent_orchestrator.py

      - name: Run P0 Critical Security Regression Suite
        run: |
          python server/test_p0_security.py

      - name: Run Real PostgreSQL RLS & Concurrency Integration Tests (Non-Superuser Runtime)
        run: |
          DATABASE_URL="postgresql://aether_app_runtime:runtime_secure_pass@localhost:5432/aether_test" python server/test_postgres_rls_security.py

  frontend-build:
    name: ⚛️ Frontend Build & Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd desktop
          npm ci || npm install

      - name: Build Desktop Frontend (Vite)
        run: |
          cd desktop
          npm run build
