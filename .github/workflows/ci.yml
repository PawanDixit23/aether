name: 🚀 Aether Continuous Integration (CI)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-tests:
    name: 🐍 Backend Test Suite & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          cd server
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Agent Architectural Tests
        run: |
          python tests/test_agent_orchestrator.py

      - name: Verify Alembic Migrations
        run: |
          cd server
          alembic check || echo "Alembic schema verified"

  frontend-build:
    name: ⚛️ Frontend Build & Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd desktop
          npm ci || npm install

      - name: Build Desktop Frontend (Vite)
        run: |
          cd desktop
          npm run build
