version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aether-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Kolkata
      - TIMEZONE=Asia/Kolkata
      - PYTHONUNBUFFERED=1
    env_file:
      - server/.env
    volumes:
      - ./server:/app/server
      - aether-data:/app/server/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  desktop-dev:
    image: node:20-alpine
    container_name: aether-desktop-dev
    working_dir: /app
    volumes:
      - ./desktop:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aether-data:
    driver: local

