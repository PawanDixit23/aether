# ⚡ Aether 1-Click Cloud Deployment Blueprint for Render
services:
  - type: web
    name: aether-ai-executive
    runtime: docker
    plan: free
    region: oregon
    branch: dev
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_PATH
        value: /app/server/aether.db
      # One Uvicorn process: at most 10 pooled DB connections per instance.
      # Keep these values aligned with the Supabase project connection budget.
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_POOL_MAX_OVERFLOW
        value: 5
      - key: DB_POOL_TIMEOUT_SECONDS
        value: 20
    healthCheckPath: /health
